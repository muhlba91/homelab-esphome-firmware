# Secrets for CI and local runs, read from Vault with fnox (https://fnox.jdx.dev)
#
# - CI: the default profile; the Vault token comes from the GitHub OIDC login (hashicorp/vault-action, exportToken)
# - developer machines: FNOX_PROFILE=dev adds the local Google Cloud credentials (impersonating the CI service account)
#   from the machine's global fnox config (GCP_SOURCE_CREDENTIALS)
#
# run: fnox exec -- ./scripts/upload_firmware.sh <bucket path>

if_missing = "error"

# the repository's Vault mount; the token from VAULT_TOKEN (CI) or the Vault CLI's token helper
[providers.vault]
type = "vault"
path = "github-homelab-esphome-firmware"
credential_command = "vault print token"

[secrets]
CLOUDSDK_COMPUTE_REGION = { provider = "vault", value = "google-cloud/region" }
GOOGLE_WORKLOAD_IDENTITY_PROVIDER = { provider = "vault", value = "google-cloud/workload_identity_provider" }
GOOGLE_WORKLOAD_IDENTITY_SERVICE_ACCOUNT = { provider = "vault", value = "google-cloud/ci_service_account" }
SCW_ORGANIZATION_ID = { provider = "vault", value = "scaleway/organization_id" }
SCW_PROJECT_ID = { provider = "vault", value = "scaleway/project_id" }
SCW_DEFAULT_REGION = { provider = "vault", value = "scaleway/region" }
SCW_DEFAULT_ZONE = { provider = "vault", value = "scaleway/zone" }
SCW_ACCESS_KEY = { provider = "vault", value = "scaleway/access_key" }
SCW_SECRET_KEY = { provider = "vault", value = "scaleway/secret_key" }

# developer machines only: impersonate the CI service account with the machine's own key
[profiles.dev.secrets.GOOGLE_APPLICATION_CREDENTIALS]
as_file = true
default = '''{
  "type": "impersonated_service_account",
  "service_account_impersonation_url": "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${GOOGLE_WORKLOAD_IDENTITY_SERVICE_ACCOUNT}:generateAccessToken",
  "delegates": [],
  "source_credentials": ${GCP_SOURCE_CREDENTIALS}
}'''
description = "impersonated CI service account (Google client libraries)"

# gcloud ignores GOOGLE_APPLICATION_CREDENTIALS
[profiles.dev.secrets.CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE]
as_file = true
default = "${GOOGLE_APPLICATION_CREDENTIALS}"
description = "impersonated CI service account (gcloud)"
